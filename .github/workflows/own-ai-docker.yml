name: Validate JARVIS self-hosted AI container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.own-ai.yml'
      - 'package.json'
      - 'server.ts'
      - 'ai/**'
      - '.github/workflows/own-ai-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.own-ai.yml config --quiet

      - name: Build JARVIS server image
        run: docker build --tag jarvis-own-ai:test .
